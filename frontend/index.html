<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Cbox — Calm, modern private messaging and photo sharing across desktop, mobile web, and Android." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Cbox — Private Social Chat</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cbox_theme') || 'SYSTEM';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'DARK' || (saved === 'SYSTEM' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-cbox-bg text-cbox-text antialiased selection:bg-cbox-accent/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
