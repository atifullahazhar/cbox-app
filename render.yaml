# Render Blueprint — One-click PostgreSQL + Full-Stack Cbox Web Service
# Push this repository to GitHub, then on Render click: New -> Blueprint -> Select Repo

databases:
  - name: cbox-db
    plan: free
    databaseName: cbox
    user: cbox_user

services:
  - type: web
    name: cbox-app
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: ALLOW_BLOCKING_DEVELOPERS
        value: "false"
      - key: DEVELOPER_CODE_ALLOW_DEMO_9_DIGIT
        value: "true"
      - key: DEVELOPER_ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cbox-db
          property: connectionString
