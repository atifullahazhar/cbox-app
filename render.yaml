# Render Blueprint — Chatterbox Phase 2 (Python FastAPI Auth + Node.js Express/Socket.IO + PostgreSQL)

databases:
  - name: cbox-db
    plan: free
    databaseName: cbox
    user: cbox_user

services:
  - type: web
    name: cbox-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: SMS_PROVIDER
        value: demo
      - key: OTP_DEMO_MODE
        value: "true"
      - key: ALLOW_BLOCKING_DEVELOPERS
        value: "false"
      - key: DEVELOPER_CODE_ALLOW_DEMO_9_DIGIT
        value: "true"
      - key: DEVELOPER_ACCESS_CODE
        sync: false
      - key: INTERNAL_AUTH_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cbox-db
          property: connectionString
