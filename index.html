<!doctype html>
<html lang="en" data-theme="midnight-neon" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Chatterbox — Phone-verified private social messaging, 1:1 voice/video calls, groups, stories, and 10 animated themes." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Chatterbox — Private Social Chat</title>
    <script>
      (function () {
        try {
          var key = localStorage.getItem('chatterbox_theme_key') || 'midnight-neon';
          var lightThemes = ['crisp-daylight', 'cherry-blossom', 'lavender-dream'];
          document.documentElement.setAttribute('data-theme', key);
          document.documentElement.classList.toggle('dark', lightThemes.indexOf(key) === -1);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-cbox-bg text-cbox-text antialiased selection:bg-cbox-accent/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
