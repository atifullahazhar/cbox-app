version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cbox_user
      POSTGRES_PASSWORD: cbox_local_dev_password
      POSTGRES_DB: cbox
    ports:
      - "5432:5432"
    volumes:
      - cbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbox_user -d cbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cbox_pgdata:
